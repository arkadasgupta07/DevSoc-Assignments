<!DOCTYPE html>
<html>
  <head>
    <title>Basic Calculator</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="header-container">
      <h1 class="title"><u> Basic Calculator </u></h1>
    </div>

    <div class="calculator">
      <input type="text" id="display" disabled />
      <!-- id="display": A unique name so JavaScript can find it.
      disabled: Prevents the user from typing with their physical keyboard directly into the box. -->

      <div class="buttons">
        <!-- <div class="buttons">: A container specifically for the keypad. -->
        <button onclick="clearDisplay()" class="operator-button">AC</button>
        <button onclick="deleteLast()" class="operator-button span-two">
          DEL
        </button>
        <button onclick="appendToDisplay('/')" class="operator-button">
          /
        </button>

        <button onclick="appendToDisplay('7')">7</button>
        <button onclick="appendToDisplay('8')">8</button>
        <button onclick="appendToDisplay('9')">9</button>

        <button onclick="appendToDisplay('*')" class="operator-button">
          *
        </button>

        <button onclick="appendToDisplay('4')">4</button>
        <button onclick="appendToDisplay('5')">5</button>
        <button onclick="appendToDisplay('6')">6</button>
        <button onclick="appendToDisplay('+')" class="operator-button">
          +
        </button>

        <button onclick="appendToDisplay('1')">1</button>
        <button onclick="appendToDisplay('2')">2</button>
        <button onclick="appendToDisplay('3')">3</button>
        <button onclick="appendToDisplay('-')" class="operator-button">
          -
        </button>

        <button onclick="appendToDisplay('0')" class="zero-btn span-two">
          0
        </button>
        <button onclick="appendToDisplay('.')">.</button>
        <button onclick="calculate()" class="operator-button">=</button>
      </div>
    </div>
    <script src="script.js"></script>
    <!-- It tells the browser to load your JavaScript logic after the buttons are already created on the screen. -->
  </body>
</html>
